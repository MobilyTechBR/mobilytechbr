<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./index.html">
  <title>MobilyTech BR</title>
  <link rel="canonical" href="./index.html">
  <style>
    :root {
      color-scheme: dark;
      --bg: #03070d;
      --cyan: #17d9ff;
      --green: #22f0c4;
      --text: #f5fbff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(23, 217, 255, .14), transparent 34%),
        linear-gradient(180deg, #03070d, #071018 58%, #03070d);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }

    main {
      width: min(480px, 100%);
      padding: 28px;
      border: 1px solid rgba(121, 247, 255, .18);
      border-radius: 22px;
      background: rgba(8, 17, 25, .78);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .36);
    }

    img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(23, 217, 255, .34));
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 18px;
      color: rgba(245, 251, 255, .72);
      font-weight: 700;
    }

    a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 999px;
      color: #041016;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      text-decoration: none;
      font-weight: 900;
      box-shadow: 0 0 28px rgba(23, 217, 255, .24);
    }
  </style>
</head>
<body>
  <main>
    <img src="./assets/mobilytech-logo.png" alt="">
    <h1>MobilyTech BR</h1>
    <p>Você será levado para a loja atual.</p>
    <a href="./index.html">Abrir loja</a>
  </main>
</body>
</html>
