media:
  input: assets
  output: ./assets
  categories:
    - image
  rename: safe

content:
  - name: automationSettings
    label: Automacoes do site
    type: file
    path: data/automation-settings.json
    format: json
    fields:
      - name: postSaleEmailsEnabled
        label: Ativar e-mails de pos-venda
        type: boolean
        default: true
      - name: postSalePollMinutes
        label: Intervalo dos e-mails de pos-venda em minutos
        type: number
        default: 5
        description: "Recomendado: 5 minutos."
      - name: sellerNotificationsEnabled
        label: Enviar e-mail interno quando vender
        type: boolean
        default: true
      - name: sellerEmail
        label: E-mail que recebe avisos internos
        type: string
        default: mobilytechbr@gmail.com
      - name: marketplacePriceSyncEnabled
        label: Ativar verificacao de anuncios Facebook/OLX
        type: boolean
        default: true
        description: "Verifica preco pelo Facebook, remocoes, novos anuncios e links da OLX."
      - name: marketplacePriceSyncMode
        label: Modo da verificacao de precos
        type: select
        default: auto
        options:
          values:
            - review
            - auto
        description: "Auto aplica somente quando a confianca passar do limite seguro."
      - name: marketplacePriceSyncIntervalMinutes
        label: Intervalo da verificacao de precos em minutos
        type: number
        default: 360
        description: "Recomendado: 360 minutos, ou seja, a cada 6 horas."
      - name: marketplacePriceSyncHighConfidenceThreshold
        label: Confianca minima para aplicar sozinho
        type: number
        default: 95
        description: "Use 95 para exigir quase certeza antes de alterar preco/remover sozinho."
      - name: marketplacePriceSyncRequireManualApproval
        label: Exigir aprovacao manual para tudo
        type: boolean
        default: false
      - name: marketplacePriceSyncApplyOnlyHighConfidence
        label: Aplicar somente quando a confianca for alta
        type: boolean
        default: true
      - name: marketplaceRemovalSyncAutoApply
        label: Remover anuncio sozinho com alta confianca
        type: boolean
        default: true
        description: "Se desligado, remocoes sempre viram e-mail de aprovacao."
      - name: marketplaceOlxLinkReviewEnabled
        label: Revisar links da OLX por e-mail
        type: boolean
        default: true
        description: "OLX sugere links de redirecionamento e pode criar rascunhos de SSDs; preco de OLX so e usado para SSD sem Facebook."
      - name: marketplaceDraftCreationEnabled
        label: Criar rascunhos inativos de novos anuncios
        type: boolean
        default: true
        description: "Quando detectar anuncio novo no Facebook ou SSD novo na OLX, cria no painel como inativo para voce revisar fotos e ativar."
      - name: marketplaceFacebookProfileUrl
        label: Perfil do Facebook Marketplace
        type: string
        default: "https://www.facebook.com/marketplace/profile/100035688601043/?ref=permalink&mibextid=6ojiHh"
      - name: marketplaceOlxProfileUrl
        label: Perfil da OLX
        type: string
        default: "https://www.olx.com.br/perfil/julian-859fd666"
  - name: globalAddons
    label: Adicionais globais
    type: file
    path: data/addons.json
    format: json
    list: true
    fields:
      - name: id
        label: ID interno
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use apenas letras minusculas, numeros e tracos."
        description: "Identificador unico. Exemplo: ssd-240gb"
      - name: active
        label: Ativo no site
        type: boolean
        default: true
      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values:
            - storage
            - peripherals
      - name: label
        label: Nome do adicional
        type: string
        required: true
        description: "Exemplo: SSD 240GB"
      - name: price
        label: Preco adicional
        type: number
        required: true
        description: "Digite apenas o numero. Exemplo: 150. O site mostra como reais automaticamente."
      - name: image
        label: Foto do adicional
        type: image
        description: "Opcional. Aparece como miniatura clicavel no site."
      - name: cutout
        label: Foto recortada/PNG do adicional
        type: image
        description: "Opcional. Se ficar vazio e houver foto, o GitHub tenta criar a versao sem fundo automaticamente."
  - name: globalSwaps
    label: Trocas globais de pecas
    type: file
    path: data/swaps.json
    format: json
    list: true
    fields:
      - name: id
        label: ID interno
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use apenas letras minusculas, numeros e tracos."
        description: "Identificador unico. Exemplo: storage-ssd-240gb-upgrade"
      - name: active
        label: Ativo no site
        type: boolean
        default: true
      - name: target
        label: Peca que sera trocada
        type: select
        required: true
        options:
          values:
            - storage
            - memory
            - gpu
            - powerSupply
        description: "Processador fica nas trocas especificas de cada produto."
      - name: label
        label: Nome da troca
        type: string
        required: true
        description: "Exemplo: Trocar por SSD 240GB"
      - name: price
        label: Diferenca no preco
        type: number
        required: true
        description: "Digite positivo para acrescentar e negativo para abater. Exemplo: 100 ou -55."
      - name: whenContains
        label: Mostrar quando a configuracao contiver
        type: string
        list: true
        description: "Opcional. Exemplo: 128GB. Se vazio, aparece para todos os PCs que tenham essa peca."
      - name: excludeContains
        label: Nao mostrar quando a configuracao contiver
        type: string
        list: true
        description: "Opcional. Exemplo: NVINET 750W."
  - name: products
    label: Anuncios e produtos
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: ID interno
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use apenas letras minusculas, numeros e tracos."
        description: "Identificador unico. Exemplo: pc-gamer-ryzen-5-3600x"
      - name: active
        label: Ativo no site
        type: boolean
        default: true
      - name: category
        label: Tipo de produto
        type: select
        default: pc
        options:
          values:
            - pc
            - ssd
            - fonte
            - hardware
        description: "Use pc para computadores completos, ssd para armazenamento, fonte para fontes de alimentacao e hardware para outros itens."
      - name: title
        label: Titulo
        type: string
        required: true
      - name: price
        label: Preco
        type: number
        required: true
        description: "Digite apenas o numero. Exemplo: 4000. O site mostra como R$ 4.000,00 automaticamente."
      - name: old
        label: Preco antigo
        type: number
        description: "Opcional. Digite apenas o numero, sem R$."
      - name: shipping
        label: Caixa para frete
        type: object
        description: "Opcional. Use para sobrescrever o peso e as medidas padrao da Vercel neste produto."
        fields:
          - name: weightKg
            label: Peso da caixa em kg
            type: number
            description: "Exemplo: 9.5"
          - name: heightCm
            label: Altura da caixa em cm
            type: number
            description: "Exemplo: 55"
          - name: widthCm
            label: Largura da caixa em cm
            type: number
            description: "Exemplo: 35"
          - name: lengthCm
            label: Comprimento da caixa em cm
            type: number
            description: "Exemplo: 60"
          - name: insuranceValue
            label: Valor segurado
            type: number
            description: "Opcional. Se vazio, usa o preco do produto."
      - name: badge
        label: Selo do card
        type: string
      - name: image
        label: Foto principal
        type: image
        required: true
      - name: cutout
        label: Foto recortada/PNG do produto
        type: image
        description: "Opcional. Se ficar vazio, o GitHub tenta gerar automaticamente uma versao sem fundo a partir da foto principal."
      - name: gallery
        label: Fotos extras do produto
        type: object
        list: true
        description: "Opcional. Essas fotos aparecem somente quando o cliente clica na foto do produto para abrir o zoom/galeria."
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: cutout
            label: Foto recortada/PNG
            type: image
            description: "Opcional. Se ficar vazio, o GitHub tenta gerar a versao sem fundo automaticamente."
      - name: photo
        label: Formato da foto
        type: select
        default: square
        options:
          values:
            - square
            - portrait
      - name: tags
        label: Bolhas/tags
        type: string
        list: true
      - name: specs
        label: Especificacoes
        type: object
        fields:
          - name: processor
            label: Processador
            type: string
          - name: memory
            label: Memoria
            type: string
          - name: gpu
            label: Placa de video
            type: string
          - name: powerSupply
            label: Fonte
            type: string
          - name: storage
            label: Armazenamento
            type: string
          - name: brand
            label: Marca
            type: string
          - name: model
            label: Modelo
            type: string
          - name: capacity
            label: Capacidade
            type: string
          - name: type
            label: Tipo
            type: string
          - name: formFactor
            label: Formato
            type: string
          - name: interface
            label: Interface
            type: string
          - name: wattage
            label: Potencia
            type: string
          - name: certification
            label: Certificacao
            type: string
          - name: connectors
            label: Conectores / pinagem
            type: string
      - name: links
        label: Links dos anuncios
        type: object
        fields:
          - name: olx
            label: Link da OLX
            type: string
          - name: facebook
            label: Link do Facebook Marketplace
            type: string
      - name: addons
        label: Opcionais especificos deste produto
        type: object
        description: "Use somente quando o opcional for exclusivo deste produto. Os adicionais globais aparecem automaticamente somente em PCs."
        fields:
          - name: storage
            label: Armazenamento
            type: object
            list: true
            fields:
              - name: active
                label: Ativo
                type: boolean
                default: true
              - name: label
                label: Nome do opcional
                type: string
                required: true
                description: "Exemplo: SSD 240GB instalado"
              - name: price
                label: Preco adicional
                type: number
                required: true
                description: "Digite apenas o numero. Exemplo: 150."
              - name: image
                label: Foto do opcional
                type: image
                description: "Opcional. Aparece como miniatura clicavel no site."
              - name: cutout
                label: Foto recortada/PNG do opcional
                type: image
                description: "Opcional. Se ficar vazio e houver foto, o GitHub tenta criar a versao sem fundo automaticamente."
          - name: peripherals
            label: Mouse e teclado / kits perifericos
            type: object
            list: true
            fields:
              - name: active
                label: Ativo
                type: boolean
                default: true
              - name: label
                label: Nome do opcional
                type: string
                required: true
                description: "Exemplo: Kit mouse + teclado"
              - name: price
                label: Preco adicional
                type: number
                required: true
                description: "Digite apenas o numero. Exemplo: 80."
              - name: image
                label: Foto do opcional
                type: image
                description: "Opcional. Aparece como miniatura clicavel no site."
              - name: cutout
                label: Foto recortada/PNG do opcional
                type: image
                description: "Opcional. Se ficar vazio e houver foto, o GitHub tenta criar a versao sem fundo automaticamente."
      - name: swaps
        label: Trocas especificas deste produto
        type: object
        description: "Use principalmente para processador, porque isso depende de cada PC. Trocas globais de memoria, fonte e armazenamento ficam em outra aba."
        fields:
          - name: processor
            label: Trocas de processador
            type: object
            list: true
            fields:
              - name: active
                label: Ativo
                type: boolean
                default: true
              - name: label
                label: Nome da troca
                type: string
                required: true
                description: "Exemplo: Trocar por Xeon E3-1230"
              - name: price
                label: Diferenca no preco
                type: number
                required: true
                description: "Digite positivo para acrescentar e negativo para abater."
              - name: whenContains
                label: Mostrar quando o processador contiver
                type: string
                list: true
                description: "Opcional. Exemplo: E3-1220."
              - name: excludeContains
                label: Nao mostrar quando o processador contiver
                type: string
                list: true
                description: "Opcional."
      - name: featured
        label: Destaque interno
        type: boolean
        default: false
